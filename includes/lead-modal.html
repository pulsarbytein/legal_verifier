<!-- Shared Consultation Lead Modal -->
<div class="modal fade" id="consultationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg">
            <div class="modal-header bg-navy text-white rounded-top-4 border-0 py-3">
                <div class="d-flex align-items-center">
                    <i class="fa-solid fa-scale-balanced text-gold fs-4 me-2"></i>
                    <div>
                        <h5 class="modal-title fw-bold mb-0 text-white">Get Free Legal Consultation</h5>
                        <span class="fs-8 text-light opacity-75">Talk to our experts today</span>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="modalLeadForm" onsubmit="handleFormSubmit(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Full Name *</label>
                        <input type="text" class="form-control form-control-lg fs-6" placeholder="Enter your full name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Email Address *</label>
                        <input type="email" class="form-control form-control-lg fs-6" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Mobile Number *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">+91</span>
                            <input type="tel" class="form-control form-control-lg fs-6" placeholder="10-digit mobile number" required pattern="[0-9]{10}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Select Service Requirement *</label>
                        <select class="form-select form-select-lg fs-6" required>
                            <option value="" selected disabled>Select Service</option>
                            <option value="creator">Creator Protection & Unpaid Payments</option>
                            <option value="virtual-office">LVVO Virtual Office & GST Address</option>
                            <option value="defence">Defence Personnel Legal Support</option>
                            <option value="dispute">Online Dispute Resolution (ODR)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-gold w-100 btn-lg fw-bold rounded-3 py-2 text-dark shadow-sm">Submit Consultation Request <i class="bi bi-arrow-right ms-1"></i></button>
                    <p class="text-center small text-muted mb-0 mt-2"><i class="bi bi-shield-lock-fill text-success me-1"></i> 100% Confidential & Secure</p>
                </form>
            </div>
        </div>
    </div>
</div>
